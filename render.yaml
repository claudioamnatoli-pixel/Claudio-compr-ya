# Despliegue de un clic: crea el servidor y la base PostgreSQL juntos, con las
# variables ya puestas. La contraseña de sesión se genera sola, para que no haya
# ningún secreto escrito en el repositorio.
#
# El plan NO se declara a propósito. Si acá dijera `plan: free`, cada
# sincronización devolvería el servicio al plan gratuito y pisaría lo que se
# haya pagado en el panel. Omitirlo hace que Render conserve el plan que el
# servicio tenga puesto, así el cambio a pago se hace una vez, en el panel, y
# queda.
services:
  - type: web
    name: compra-ya
    runtime: node
    region: oregon
    branch: claude/tiktok-ecommerce-program-5y1bcr
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: compra-ya-base
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_MONEDA
        value: PYG
      - key: NEXT_PUBLIC_LOCALE
        value: es-PY
      - key: NEXT_PUBLIC_PREFIJO_PAIS
        value: "595"
      - key: NEXT_PUBLIC_NOMBRE_TIENDA
        value: Compra Ya

databases:
  - name: compra-ya-base
    databaseName: compraya
    user: compraya
